<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>ベステラ 配置管理</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="auth-screen" class="screen active">
    <div class="auth-card">
      <h1>ベステラ 配置管理</h1>
      <p class="muted">本サイトの内容は暗号化されています。<br>パスワードを入力してください。</p>
      <form id="auth-form">
        <input type="password" id="password" placeholder="パスワード" autofocus required>
        <button type="submit">ログイン</button>
      </form>
      <p id="auth-error" class="error hidden">パスワードが正しくありません。</p>
    </div>
  </div>

  <div id="main-screen" class="screen hidden">
    <header>
      <h1>ベステラ 配置管理</h1>
      <div class="header-controls">
        <button id="sync-button">同期</button>
        <span class="muted">最終同期 <span id="last-sync">未同期</span></span>
        <button id="logout-button" class="link">ログアウト</button>
      </div>
    </header>

    <nav class="view-tabs">
      <button class="view-tab active" data-view="cards">カードビュー</button>
      <button class="view-tab" data-view="gantt-person" disabled>ガント（人）</button>
      <button class="view-tab" data-view="gantt-project" disabled>ガント（現場）</button>
      <button class="view-tab" data-view="gantt-department" disabled>ガント（事務所）</button>
      <button class="view-tab" data-view="gantt-qualification" disabled>ガント（資格）</button>
    </nav>

    <nav class="category-tabs">
      <button class="category-tab active" data-category="all">全て <span class="badge">-</span></button>
      <button class="category-tab" data-category="監督職">監督職 <span class="badge">-</span></button>
      <button class="category-tab" data-category="準監督職">準監督職 <span class="badge">-</span></button>
      <button class="category-tab" data-category="広義監督職">広義監督職 <span class="badge">-</span></button>
    </nav>

    <div class="filter-bar">
      <select id="filter-department"><option value="">全事務所</option></select>
      <select id="filter-role"><option value="">全役職</option></select>
      <input type="search" id="filter-name" placeholder="氏名検索">
    </div>

    <main id="view-container">
      <p class="loading">読み込み中...</p>
    </main>
  </div>

  <script src="js/crypto.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/views/cards.js"></script>
  <script src="js/views/gantt.js"></script>
  <script src="js/config.js" onerror="console.info('config.js未設定（モックデータで動作）')"></script>
  <script src="js/app.js"></script>
</body>
</html>
